# benchmark/models.yaml
# SQLBench-OpenEnv model registry
# All models accessed via OpenRouter (single API key, gateway pattern).
# Ordered: frontier first, then open-weight for comparison.

benchmark_name: "SQLBench-OpenEnv"
version: "1.1.0"
description: >
  Evaluation of LLM capability on SQL correction and optimization tasks.
  Covers syntax repair, join logic, aggregation correctness, and query efficiency.

# Global provider configuration (gateway pattern — one key for all models)
provider: "openrouter"
api_key_env: "OPENROUTER_API_KEY"
base_url: "https://openrouter.ai/api/v1"

models:
  # ── Frontier models ─────────────────────────────────────────────────────────
  - id: "qwen2-5-coder-32b"
    name: "Qwen2.5-Coder 32B"
    model_string: "qwen/qwen-2.5-coder-32b-instruct"
    max_tokens: 512
    temperature: 0.1

  - id: "gpt-4o-mini"
    name: "GPT-4o-mini"
    model_string: "openai/gpt-4o-mini"
    max_tokens: 512
    temperature: 0.1

  # ── Open-weight baseline ─────────────────────────────────────────────────────
  - id: "ling-2-6-1t-free"
    name: "Ling-2.6-1T (Free)"
    model_string: "inclusionai/ling-2.6-1t:free"
    max_tokens: 512
    temperature: 0.1

# Tasks to include in the benchmark run.
# Maps to task IDs in sql_query_env/tasks.py.
benchmark_tasks:
  easy:
    - fix_syntax_simple
    - fix_table_name
  medium:
    - fix_join_logic
    - fix_aggregate_logic
  hard:
    - multi_constraint_query
    - ecommerce_supply_chain

# Evaluation settings
settings:
  max_steps_per_episode: 5     # 3 models × 6 tasks × 5 steps = 90 API calls
  runs_per_task: 1             # Increase to 3 for variance analysis
  seed: 42
  timeout_seconds: 300         # Per-task wall-clock timeout
