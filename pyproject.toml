[project]
name = "sql-query-env"
version = "0.1.0"
description = "OpenEnv benchmark for evaluating LLM agents on SQL debugging and query optimization tasks."
authors = [
  { name="Naresh Chandu" }
]
requires-python = ">=3.10"

dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.1",
  "openenv-core==0.1.0",
  "openai==1.30.1",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.1",
  "sqlparse>=0.6.0",
  "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "requests>=2.31.0",
  "sqlalchemy>=2.0.0",
  "passlib>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.buildmeta"

[tool.setuptools]
packages = ["sql_query_env", "server", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
